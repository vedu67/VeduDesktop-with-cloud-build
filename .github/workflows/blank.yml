name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Where we install the SDK on the runner
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradle wrapper executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Install Android SDK command-line tools and required components
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y unzip wget

          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          cd "${ANDROID_SDK_ROOT}"
          # Download the latest command line tools (URL may change; update if needed)
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools
          # Move into expected folder structure
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/ || true
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PATH}"

          # Accept licenses and install required packages. Replace android-33/build-tools version with your project's requirements.
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Build debug APK
        # Use the wrapper if present; fallback to system gradle only if you intentionally want that.
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            # If you intentionally don't have a wrapper, keep your existing setup-gradle step and use gradle here
            gradle assembleDebug --no-daemon
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeduDesktop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
